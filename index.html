<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Finance Tracker Pro</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#2563eb'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function App() {
      const getTodayString = () => new Date().toISOString().split('T')[0];

      // AUTH STATES
      const [currentUser, setCurrentUser] = useState({ name: 'User', email: 'user@example.com' });

      // Modal States
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isDashboardSummaryOpen, setIsDashboardSummaryOpen] = useState(false);
      const [isNewDashboardOpen, setIsNewDashboardOpen] = useState(false); 
      const [isAnalyticsOpen, setIsAnalyticsOpen] = useState(false);
      const [isReportsOpen, setIsReportsOpen] = useState(false);
      const [isSummaryOpen, setIsSummaryOpen] = useState(false);
      const [isAdminOpen, setIsAdminOpen] = useState(false);
	  const [isBudgetModalOpen, setIsBudgetModalOpen] = useState(false); // Budget Set Modal State
      const [activeAdminTab, setActiveAdminTab] = useState('category');
      const [selectedCategoryDetails, setSelectedCategoryDetails] = useState(null);
	  const [selectedDayDetails, setSelectedDayDetails] = useState(null); // State for Bar click details

      // Date Range States
      const [dashStartDate, setDashStartDate] = useState('2026-01-01');
      const [dashEndDate, setDashEndDate] = useState(getTodayString());
      const [analyticsStartDate, setAnalyticsStartDate] = useState('2026-01-01');
      const [analyticsEndDate, setAnalyticsEndDate] = useState(getTodayString());
      const [reportPeriod, setReportPeriod] = useState('monthly');
      const [reportType, setReportType] = useState('income');
      const [reportStartDate, setReportStartDate] = useState('2026-01-01');
      const [reportEndDate, setReportEndDate] = useState(getTodayString());
      const [summaryPeriod, setSummaryPeriod] = useState('all');
      const [summaryStartDate, setSummaryStartDate] = useState('2026-01-01');
      const [summaryEndDate, setSummaryEndDate] = useState(getTodayString());
      const [pieStartDate, setPieStartDate] = useState('2026-01-01');
      const [pieEndDate, setPieEndDate] = useState(getTodayString());

      // Top 10 Expenses Date Range States (নতুন যুক্ত করা হয়েছে)
      const [top10StartDate, setTop10StartDate] = useState('2026-01-01');
      const [top10EndDate, setTop10EndDate] = useState(getTodayString());

      // App Settings States
      const [theme, setTheme] = useState('system');
      const [currency, setCurrency] = useState('৳');

      // --- LOCALSTORAGE LOADERS WITH DEFAULT FALLBACKS ---
      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('sft_categories');
        return saved ? JSON.parse(saved) : ['Groceries', 'Salary', 'Bills', 'Shopping', 'Freelancing', 'Medical'];
      });
      
      const [accountsList, setAccountsList] = useState(() => {
        const saved = localStorage.getItem('sft_accounts');
        return saved ? JSON.parse(saved) : ['Cash', 'Bank', 'bKash', 'Nagad', 'Rocket', 'Credit Card', 'DBBL', 'City Bank', 'AB Bank'];
      });

      const [activityLogs, setActivityLogs] = useState(() => {
        const saved = localStorage.getItem('sft_activity_logs');
        return saved ? JSON.parse(saved) : [{ id: 1, action: 'Added initial transactions', time: new Date().toLocaleString() }];
      });

      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('sft_transactions');
        return saved ? JSON.parse(saved) : [
          { id: 1, amount: 50000, type: 'income', category: 'Salary', description: 'Monthly Salary', date: '2026-07-01', account: 'City Bank' },
          { id: 2, amount: 8500, type: 'expense', category: 'Groceries', description: 'Monthly Bazar', date: '2026-07-05', account: 'bKash' },
          { id: 3, amount: 2200, type: 'expense', category: 'Bills', description: 'Electricity & Wifi', date: '2026-07-10', account: 'Cash' },
          { id: 4, amount: 4500, type: 'expense', category: 'Shopping', description: 'Clothes', date: '2026-07-12', account: 'Credit Card' },
          { id: 5, amount: 15000, type: 'income', category: 'Freelancing', description: 'Web Project', date: '2026-07-15', account: 'DBBL' },
          { id: 6, amount: 1200, type: 'expense', category: 'Medical', description: 'Medicine', date: getTodayString(), account: 'Nagad' },
          { id: 7, amount: 1500, type: 'expense', category: 'Groceries', description: 'Vegetables & Fruits', date: '2026-07-18', account: 'Cash' },
          { id: 8, amount: 45000, type: 'income', category: 'Salary', description: 'Previous Month Salary', date: '2026-06-01', account: 'City Bank' },
          { id: 9, amount: 12000, type: 'expense', category: 'Shopping', description: 'Eid Shopping', date: '2026-06-15', account: 'Credit Card' }
        ];
      });

      const [budgetLimit, setBudgetLimit] = useState(() => {
        const saved = localStorage.getItem('sft_budget_limit');
        return saved ? JSON.parse(saved) : 30000;
      });

      // Category wise budget state
      const [categoryBudgets, setCategoryBudgets] = useState(() => {
        const saved = localStorage.getItem('sft_category_budgets');
        return saved ? JSON.parse(saved) : {};
      });

		// Goal Progress Emergency Savings
		const handleUpdateGoal = () => {
		  const newCurrent = prompt("Enter new saved amount:", goal.current);
		  const newTarget = prompt("Enter target amount:", goal.target);
		  
		  if (newCurrent !== null && newTarget !== null) {
			const updatedGoal = {
			  ...goal,
			  current: Number(newCurrent) || goal.current,
			  target: Number(newTarget) || goal.target
			};
			setGoal(updatedGoal);
			localStorage.setItem('sft_goal', JSON.stringify(updatedGoal));
		}
		};


		const [goal, setGoal] = useState(() => {
		  const saved = localStorage.getItem('sft_goal');
		  return saved ? JSON.parse(saved) : { 
			name: 'Emergency Savings', 
			target: 100000, 
			current: 0,
			deposits: [] 
		  };
		});


		// মোডাল খোলা/বন্ধ রাখার স্টেট
		const [isDepositModalOpen, setIsDepositModalOpen] = useState(false);

		// ডেট রেঞ্জ ফিল্টারের জন্য স্টেট
		const [startDate, setStartDate] = useState('');
		const [endDate, setEndDate] = useState('');


		// Add Deposit মোডাল ও ইনপুটের স্টেট
		const [isAddDepositOpen, setIsAddDepositOpen] = useState(false);
		const [depositAmount, setDepositAmount] = useState('');
		const [depositDate, setDepositDate] = useState(new Date().toISOString().split('T')[0]); // বাই-ডিফল্ট আজকের তারিখ


		// মূল সেভিংস লক্ষ্য (Target) Edit
		const handleEditTarget = () => {
		  const newTarget = prompt("আপনার মূল সেভিংস লক্ষ্য (Target) কত করতে চান?", goal.target);
		  if (newTarget && !isNaN(newTarget)) {
			const updatedGoal = {
			  ...goal,
			  target: Number(newTarget)
			};
			setGoal(updatedGoal);
			localStorage.setItem('sft_goal', JSON.stringify(updatedGoal));
		  }
		};	


		const handleSaveDeposit = (e) => {
		  e.preventDefault();
		  const amount = Number(depositAmount);

		  if (amount && amount > 0 && depositDate) {
			const selectedDate = new Date(depositDate);

			const updatedGoal = {
			  ...goal,
			  current: (goal.current || 0) + amount,
			  deposits: [
				...(goal.deposits || []),
				{
				  id: Date.now(),
				  amount: amount,
				  // ফিল্টারিংয়ের জন্য ISO তারিখ
				  rawDate: selectedDate.toISOString(), 
				  // ডিসপ্লে করার জন্য ফরম্যাট করা তারিখ
				  date: selectedDate.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' })
				}
			  ]
			};

			setGoal(updatedGoal);
			localStorage.setItem('sft_goal', JSON.stringify(updatedGoal));

			// ইনপুট রিসেট ও মোডাল বন্ধ
			setDepositAmount('');
			setDepositDate(new Date().toISOString().split('T')[0]);
			setIsAddDepositOpen(false);
		  }
		};

		// ডেট রেঞ্জ অনুযায়ী ডিপোজিট ফিল্টার করার লজিক
		const filteredDeposits = (goal.deposits || []).filter(dep => {
		  if (!startDate && !endDate) return true;
		  const depDate = new Date(dep.rawDate || dep.id);
		  const start = startDate ? new Date(startDate) : new Date('1970-01-01');
		  const end = endDate ? new Date(endDate) : new Date('2099-12-31');
		  
		  // এন্ড ডেটকে দিনের শেষ মুহূর্ত পর্যন্ত নিয়ে যাওয়া
		  end.setHours(23, 59, 59, 999); 
		  
		  return depDate >= start && depDate <= end;
		});

		// ভুল ইনপুট মুছে ফেলার সুবিধা (ঐচ্ছিক)
		const handleDeleteDeposit = (depId, amount) => {
		  if (confirm("আপনি কি এই জমাটি মুছে ফেলতে চান?")) {
			const updatedDeposits = goal.deposits.filter(d => d.id !== depId);
			const updatedGoal = {
			  ...goal,
			  current: Math.max(0, goal.current - amount),
			  deposits: updatedDeposits
			};
			setGoal(updatedGoal);
			localStorage.setItem('sft_goal', JSON.stringify(updatedGoal));
		  }
		};


      const [upcomingBills, setUpcomingBills] = useState(() => {
        const saved = localStorage.getItem('sft_upcoming_bills');
        return saved ? JSON.parse(saved) : [
          { id: 1, title: 'Electricity Bill', amount: 2500, dueDate: '2026-08-05', status: 'Pending' },
          { id: 2, title: 'Internet & Wifi', amount: 1200, dueDate: '2026-08-10', status: 'Pending' },
          { id: 3, title: 'House Rent', amount: 15000, dueDate: '2026-08-01', status: 'Pending' }
        ];
      });

      // --- PERSIST STATES TO LOCALSTORAGE ---
      useEffect(() => { localStorage.setItem('sft_transactions', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('sft_categories', JSON.stringify(categories)); }, [categories]);
      useEffect(() => { localStorage.setItem('sft_accounts', JSON.stringify(accountsList)); }, [accountsList]);
      useEffect(() => { localStorage.setItem('sft_activity_logs', JSON.stringify(activityLogs)); }, [activityLogs]);
      useEffect(() => { localStorage.setItem('sft_budget_limit', JSON.stringify(budgetLimit)); }, [budgetLimit]);
	  useEffect(() => { localStorage.setItem('sft_category_budgets', JSON.stringify(categoryBudgets)); }, [categoryBudgets]);
      useEffect(() => { localStorage.setItem('sft_goal', JSON.stringify(goal)); }, [goal]);
      useEffect(() => { localStorage.setItem('sft_upcoming_bills', JSON.stringify(upcomingBills)); }, [upcomingBills]);

      // Admin Form Input States
      const [newCategoryInput, setNewCategoryInput] = useState('');
      const [newAccountInput, setNewAccountInput] = useState('');

      const logActivity = (actionText) => {
        setActivityLogs(prev => [{ id: Date.now(), action: actionText, time: new Date().toLocaleString() }, ...prev]);
      };

      const [editingId, setEditingId] = useState(null);
      const [formData, setFormData] = useState({
        amount: '',
        type: 'expense',
        category: 'Groceries',
        account: 'Cash',
        description: '',
        date: getTodayString()
      });

      // Filter States
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedMonth, setSelectedMonth] = useState('all');
      const [selectedYear, setSelectedYear] = useState('2026');
      const [selectedCategory, setSelectedCategory] = useState('all');

      // Theme Application Logic
      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else if (theme === 'light') {
          root.classList.remove('dark');
        } else {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
        }
      }, [theme]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [transactions, theme, top10StartDate, top10EndDate, isSettingsOpen, isDashboardSummaryOpen, isNewDashboardOpen, isAnalyticsOpen, isReportsOpen, isSummaryOpen, isAdminOpen, isBudgetModalOpen, activeAdminTab, selectedCategoryDetails, analyticsStartDate, analyticsEndDate, pieStartDate, pieEndDate, reportPeriod, reportType, summaryPeriod, summaryStartDate, summaryEndDate, dashStartDate, dashEndDate]);
		 
      // --- TOP 10 EXPENSES CALCULATIONS (নতুন যুক্ত করা হলো) ---
      const top10FilteredExpenses = useMemo(() => {
        return transactions
          .filter(t => {
            if (t.type !== 'expense') return false;
            if (top10StartDate && t.date < top10StartDate) return false;
            if (top10EndDate && t.date > top10EndDate) return false;
            return true;
          })
          .sort((a, b) => Number(b.amount) - Number(a.amount))
          .slice(0, 10);
      }, [transactions, top10StartDate, top10EndDate]);
		 		 
		 
      // --- ACCOUNT BALANCES ---
      const accountBalances = useMemo(() => {
        const balances = {};
        accountsList.forEach(acc => {
          balances[acc] = { income: 0, expense: 0, balance: 0 };
        });

        transactions.forEach(t => {
          if (!balances[t.account]) {
            balances[t.account] = { income: 0, expense: 0, balance: 0 };
          }
          if (t.type === 'income') {
            balances[t.account].income += Number(t.amount);
            balances[t.account].balance += Number(t.amount);
          } else {
            balances[t.account].expense += Number(t.amount);
            balances[t.account].balance -= Number(t.amount);
          }
        });

        return balances;
      }, [transactions, accountsList]);

      // --- DASHBOARD CALCULATIONS ---
      const dashFilteredTx = useMemo(() => {
        return transactions.filter(t => {
          if (!dashStartDate && !dashEndDate) return true;
          if (dashStartDate && t.date < dashStartDate) return false;
          if (dashEndDate && t.date > dashEndDate) return false;
          return true;
        });
      }, [transactions, dashStartDate, dashEndDate]);

      const dashAccountBalances = useMemo(() => {
        const balances = {};
        accountsList.forEach(acc => {
          balances[acc] = { income: 0, expense: 0, balance: 0 };
        });

        dashFilteredTx.forEach(t => {
          if (!balances[t.account]) {
            balances[t.account] = { income: 0, expense: 0, balance: 0 };
          }
          if (t.type === 'income') {
            balances[t.account].income += Number(t.amount);
            balances[t.account].balance += Number(t.amount);
          } else {
            balances[t.account].expense += Number(t.amount);
            balances[t.account].balance -= Number(t.amount);
          }
        });

        return balances;
      }, [dashFilteredTx, accountsList]);

      const dashIncome = useMemo(() => dashFilteredTx.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.amount), 0), [dashFilteredTx]);
      const dashExpense = useMemo(() => dashFilteredTx.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount), 0), [dashFilteredTx]);
      const currentBalance = dashIncome - dashExpense;

      const todayStr = getTodayString();
      const todayIncome = useMemo(() => dashFilteredTx.filter(t => t.date === todayStr && t.type === 'income').reduce((s, t) => s + Number(t.amount), 0), [dashFilteredTx, todayStr]);
      const todayExpense = useMemo(() => dashFilteredTx.filter(t => t.date === todayStr && t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0), [dashFilteredTx, todayStr]);

      const monthlyIncome = useMemo(() => dashFilteredTx.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0), [dashFilteredTx]);
      const monthlyExpense = useMemo(() => dashFilteredTx.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0), [dashFilteredTx]);
     

	 // Calculate dynamic total budget limit from category budgets if available
      const computedTotalBudgetLimit = useMemo(() => {
        const values = Object.values(categoryBudgets);
        if (values.length > 0) {
          return values.reduce((sum, val) => sum + Number(val || 0), 0);
        }
        return budgetLimit;
      }, [categoryBudgets, budgetLimit]);


      const topSpendingCategory = useMemo(() => {
        const catMap = {};
        dashFilteredTx.filter(t => t.type === 'expense').forEach(t => {
          catMap[t.category] = (catMap[t.category] || 0) + Number(t.amount);
        });
        let topCat = 'None';
        let maxAmount = 0;
        Object.entries(catMap).forEach(([cat, amt]) => {
          if (amt > maxAmount) {
            maxAmount = amt;
            topCat = cat;
          }
        });
        return { category: topCat, amount: maxAmount };
      }, [dashFilteredTx]);

      const dashboardCategoryData = useMemo(() => {
        const catMap = {};
        const totalExp = dashFilteredTx.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
        dashFilteredTx.filter(t => t.type === 'expense').forEach(t => {
          catMap[t.category] = (catMap[t.category] || 0) + Number(t.amount);
        });

        const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6', '#6366f1'];
        return Object.entries(catMap).map(([cat, amt], idx) => ({
          category: cat,
          amount: amt,
          percentage: totalExp > 0 ? ((amt / totalExp) * 100).toFixed(1) : 0,
          color: colors[idx % colors.length]
        })).sort((a, b) => b.amount - a.amount);
      }, [dashFilteredTx]);

      const monthlyVsData = useMemo(() => {
        const map = {};
        dashFilteredTx.forEach(t => {
          const monthKey = t.date.substring(0, 7);
          if (!map[monthKey]) map[monthKey] = { income: 0, expense: 0 };
          if (t.type === 'income') map[monthKey].income += Number(t.amount);
          else map[monthKey].expense += Number(t.amount);
        });
        return Object.entries(map).sort(([a], [b]) => a.localeCompare(b));
      }, [dashFilteredTx]);

      // --- SUMMARY CALCULATIONS ---
      const summaryFilteredTx = useMemo(() => {
        const today = new Date();
        return transactions.filter(t => {
          if (t.type !== 'expense') return false;
          const tDate = new Date(t.date);

          if (summaryPeriod === 'weekly') {
            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(today.getDate() - 7);
            return tDate >= oneWeekAgo && tDate <= today;
          } else if (summaryPeriod === 'monthly') {
            return tDate.getMonth() === today.getMonth() && tDate.getFullYear() === today.getFullYear();
          } else if (summaryPeriod === 'yearly') {
            return tDate.getFullYear() === today.getFullYear();
          } else if (summaryPeriod === 'custom') {
            if (summaryStartDate && t.date < summaryStartDate) return false;
            if (summaryEndDate && t.date > summaryEndDate) return false;
            return true;
          }
          return true;
        });
      }, [transactions, summaryPeriod, summaryStartDate, summaryEndDate]);

      const summaryCategoryData = useMemo(() => {
        const totalExp = summaryFilteredTx.reduce((sum, t) => sum + Number(t.amount), 0);
        const map = {};
        summaryFilteredTx.forEach(t => {
          map[t.category] = (map[t.category] || 0) + Number(t.amount);
        });

        const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6', '#6366f1'];
        let cumulativePercentage = 0;
        const slices = Object.entries(map).map(([cat, amount], idx) => {
          const percentage = totalExp > 0 ? (amount / totalExp) * 100 : 0;
          const start = cumulativePercentage;
          cumulativePercentage += percentage;
          return {
            category: cat,
            amount,
            percentage: percentage.toFixed(1),
            color: colors[idx % colors.length],
            startPercentage: start,
            endPercentage: cumulativePercentage
          };
        }).sort((a, b) => b.amount - a.amount);

        return { slices, totalExp };
      }, [summaryFilteredTx]);

      const downloadSummaryCSV = () => {
        const headers = ['Category', `Amount (${currency})`, 'Percentage (%)'];
        const rows = summaryCategoryData.slices.map(item => [
          `"${item.category.replace(/"/g, '""')}"`,
          item.amount,
          `${item.percentage}%`
        ]);
        rows.push(['Total Expense', summaryCategoryData.totalExp, '100%']);

        const csvContent = "\uFEFF" + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `category_summary_${summaryPeriod}_${getTodayString()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // --- ADMIN PANEL FUNCTIONS ---
      const handleAddCategory = (e) => {
        e.preventDefault();
        if (!newCategoryInput.trim()) return;
        if (categories.includes(newCategoryInput.trim())) {
          alert('Category already exists!');
          return;
        }
        setCategories([...categories, newCategoryInput.trim()]);
        logActivity(`Added new category: ${newCategoryInput.trim()}`);
        setNewCategoryInput('');
      };

      const handleDeleteCategory = (cat) => {
        if (confirm(`Are you sure you want to delete category "${cat}"?`)) {
          setCategories(categories.filter(c => c !== cat));
          logActivity(`Deleted category: ${cat}`);
        }
      };

      const handleAddAccount = (e) => {
        e.preventDefault();
        if (!newAccountInput.trim()) return;
        if (accountsList.includes(newAccountInput.trim())) {
          alert('Account already exists!');
          return;
        }
        setAccountsList([...accountsList, newAccountInput.trim()]);
        logActivity(`Added new account: ${newAccountInput.trim()}`);
        setNewAccountInput('');
      };

      const handleDeleteAccount = (acc) => {
        if (confirm(`Are you sure you want to delete account "${acc}"?`)) {
          setAccountsList(accountsList.filter(a => a !== acc));
          logActivity(`Deleted account: ${acc}`);
        }
      };

      const handleBackupData = () => {
        const backupObj = {
          transactions,
          categories,
          accountsList,
          budgetLimit,
          categoryBudgets,
          goal,
          upcomingBills,
          backupDate: new Date().toISOString()
        };
        const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(backupObj, null, 2))}`;
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", jsonString);
        downloadAnchor.setAttribute("download", `finance_backup_${getTodayString()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        logActivity('Created JSON backup of system data');
      };

      const handleRestoreData = (e) => {
        const fileReader = new FileReader();
        if (e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (parsed.transactions) setTransactions(parsed.transactions);
              if (parsed.categories) setCategories(parsed.categories);
              if (parsed.accountsList) setAccountsList(parsed.accountsList);
              if (parsed.budgetLimit) setBudgetLimit(parsed.budgetLimit);
              if (parsed.categoryBudgets) setCategoryBudgets(parsed.categoryBudgets);
              if (parsed.goal) setGoal(parsed.goal);
              if (parsed.upcomingBills) setUpcomingBills(parsed.upcomingBills);
              alert("System Data Restored Successfully!");
              logActivity('Restored system data from JSON backup file');
            } catch (err) {
              alert("Invalid JSON file format!");
            }
          };
        }
      };

      // --- ANALYTICS DATA CALCULATIONS ---
      const analyticsFilteredTx = useMemo(() => {
        return transactions.filter(t => {
          if (!analyticsStartDate && !analyticsEndDate) return true;
          if (analyticsStartDate && t.date < analyticsStartDate) return false;
          if (analyticsEndDate && t.date > analyticsEndDate) return false;
          return true;
        });
      }, [transactions, analyticsStartDate, analyticsEndDate]);

      const analyticsIncome = analyticsFilteredTx.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
      const analyticsExpense = analyticsFilteredTx.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
      const analyticsNetCash = analyticsIncome - analyticsExpense;

      const monthlyData = useMemo(() => {
        const map = {};
        analyticsFilteredTx.forEach(t => {
          const monthKey = t.date.substring(0, 7);
          if (!map[monthKey]) map[monthKey] = { income: 0, expense: 0 };
          if (t.type === 'income') map[monthKey].income += Number(t.amount);
          else map[monthKey].expense += Number(t.amount);
        });
        return Object.entries(map).sort(([a], [b]) => a.localeCompare(b));
      }, [analyticsFilteredTx]);

      const yearlyData = useMemo(() => {
        const map = {};
        analyticsFilteredTx.forEach(t => {
          const yearKey = t.date.substring(0, 4);
          if (!map[yearKey]) map[yearKey] = { income: 0, expense: 0 };
          if (t.type === 'income') map[yearKey].income += Number(t.amount);
          else map[yearKey].expense += Number(t.amount);
        });
        return Object.entries(map).sort(([a], [b]) => a.localeCompare(b));
      }, [analyticsFilteredTx]);

      const analyticsCategoryData = useMemo(() => {
        const map = {};
        analyticsFilteredTx.filter(t => t.type === 'expense').forEach(t => {
          map[t.category] = (map[t.category] || 0) + Number(t.amount);
        });
        return Object.entries(map).map(([cat, amount]) => ({
          category: cat,
          amount,
          percentage: analyticsExpense > 0 ? ((amount / analyticsExpense) * 100).toFixed(1) : 0
        })).sort((a, b) => b.amount - a.amount);
      }, [analyticsFilteredTx, analyticsExpense]);

      // --- REPORTS CALCULATIONS ---
      const reportFilteredTx = useMemo(() => {
        const today = new Date();
        return transactions.filter(t => {
          const tDate = new Date(t.date);

          if (reportPeriod === 'daily') {
            return t.date === getTodayString();
          } else if (reportPeriod === 'weekly') {
            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(today.getDate() - 7);
            return tDate >= oneWeekAgo && tDate <= today;
          } else if (reportPeriod === 'monthly') {
            return tDate.getMonth() === today.getMonth() && tDate.getFullYear() === today.getFullYear();
          } else if (reportPeriod === 'quarterly') {
            const currentQuarter = Math.floor(today.getMonth() / 3);
            const tQuarter = Math.floor(tDate.getMonth() / 3);
            return currentQuarter === tQuarter && tDate.getFullYear() === today.getFullYear();
          } else if (reportPeriod === 'yearly') {
            return tDate.getFullYear() === today.getFullYear();
          } else if (reportPeriod === 'custom') {
            if (reportStartDate && t.date < reportStartDate) return false;
            if (reportEndDate && t.date > reportEndDate) return false;
            return true;
          }
          return true;
        });
      }, [transactions, reportPeriod, reportStartDate, reportEndDate]);

      const downloadCSVReport = () => {
        let headers = [];
        let rows = [];

        if (reportType === 'income' || reportType === 'expense') {
          headers = ['ID', 'Date', 'Type', 'Description', 'Category', 'Account', `Amount (${currency})`];
          const data = reportFilteredTx.filter(t => t.type === reportType);
          rows = data.map(t => [t.id, t.date, t.type, `"${t.description.replace(/"/g, '""')}"`, t.category, t.account, t.amount]);
        } else if (reportType === 'cashbook') {
          headers = ['ID', 'Date', 'Type', 'Description', 'Category', `Amount (${currency})`];
          const data = reportFilteredTx.filter(t => t.account === 'Cash');
          rows = data.map(t => [t.id, t.date, t.type, `"${t.description.replace(/"/g, '""')}"`, t.category, t.amount]);
        } else if (reportType === 'ledger') {
          headers = ['Account', `Total Income (${currency})`, `Total Expense (${currency})`, `Net Balance (${currency})`];
          rows = accountsList.map(acc => {
            const accData = accountBalances[acc] || { income: 0, expense: 0, balance: 0 };
            return [acc, accData.income, accData.expense, accData.balance];
          });
        } else if (reportType === 'category') {
          headers = ['Category', `Total Expense (${currency})`];
          rows = categories.map(cat => {
            const catTotal = reportFilteredTx.filter(t => t.category === cat && t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
            return [cat, catTotal];
          });
        } else if (reportType === 'account') {
          headers = ['ID', 'Date', 'Type', 'Description', 'Category', 'Account', `Amount (${currency})`];
          rows = reportFilteredTx.map(t => [t.id, t.date, t.type, `"${t.description.replace(/"/g, '""')}"`, t.category, t.account, t.amount]);
        } else if (reportType === 'budget') {
          headers = ['Metric', 'Value'];
          const totalExp = reportFilteredTx.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
		  rows = [
            ['Budget Limit', computedTotalBudgetLimit],
            ['Total Spent', totalExp],
            ['Used Percentage', `${((totalExp / computedTotalBudgetLimit) * 100).toFixed(1)}%`]
          ];
        } else if (reportType === 'goal') {
          headers = ['Goal Name', 'Target Amount', 'Current Saved', 'Progress'];
          rows = [[goal.name, goal.target, goal.current, `${((goal.current / goal.target) * 100).toFixed(1)}%`]];
        } else if (reportType === 'tax') {
          headers = ['Metric', 'Amount'];
          const totalInc = reportFilteredTx.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
          rows = [
            ['Total Income', totalInc],
            ['Estimated Tax (15%)', totalInc * 0.15]
          ];
        }

        const csvContent = "\uFEFF" + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `${reportType}_report_${reportPeriod}_${getTodayString()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // --- PIE CHART UNDER TRANSACTIONS ---
      const pieFilteredTx = useMemo(() => {
        return transactions.filter(t => {
          if (t.type !== 'expense') return false;
          if (pieStartDate && t.date < pieStartDate) return false;
          if (pieEndDate && t.date > pieEndDate) return false;
          return true;
        });
      }, [transactions, pieStartDate, pieEndDate]);

      const pieFilteredData = useMemo(() => {
        const totalExp = pieFilteredTx.reduce((sum, t) => sum + Number(t.amount), 0);
        const map = {};
        pieFilteredTx.forEach(t => {
          map[t.category] = (map[t.category] || 0) + Number(t.amount);
        });

        const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6', '#6366f1'];
        let cumulativePercentage = 0;
        const slices = Object.entries(map).map(([cat, amount], idx) => {
          const percentage = totalExp > 0 ? (amount / totalExp) * 100 : 0;
          const start = cumulativePercentage;
          cumulativePercentage += percentage;
          return {
            category: cat,
            amount,
            percentage: percentage.toFixed(1),
            color: colors[idx % colors.length],
            startPercentage: start,
            endPercentage: cumulativePercentage
          };
        });

        return { slices, totalExp };
      }, [pieFilteredTx]);

      const handleCategoryClick = (categoryName, sourceTx = pieFilteredTx) => {
        const categoryItems = sourceTx.filter(t => t.category === categoryName);
        setSelectedCategoryDetails({
          category: categoryName,
          items: categoryItems,
          total: categoryItems.reduce((sum, i) => sum + Number(i.amount), 0)
        });
      };

      // --- LAST 7 DAYS EXPENSE BAR CHART DATA ---
      const last7DaysData = useMemo(() => {
        const days = [];
        const today = new Date();
        for (let i = 9; i >= 0; i--) {
          const d = new Date(today);
          d.setDate(today.getDate() - i);
          const dateStr = d.toISOString().split('T')[0];
          const displayDate = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          
          // Filter expenses for this specific date
          const dayTx = transactions.filter(t => t.type === 'expense' && t.date === dateStr);
          const totalAmount = dayTx.reduce((sum, t) => sum + Number(t.amount), 0);
          
          days.push({
            dateStr,
            displayDate,
            totalAmount,
            transactions: dayTx
          });
        }
        return days;
      }, [transactions]);

      const maxDayExpense = useMemo(() => {
        const max = Math.max(...last7DaysData.map(d => d.totalAmount), 100);
        return max;
      }, [last7DaysData]);

      const handleBarClick = (dayObj) => {
        setSelectedDayDetails(dayObj);
      };



      const renderSvgPieChart = (slices, totalExp) => {
        if (!totalExp || slices.length === 0) {
          return (
            <div className="h-44 w-44 rounded-full border-4 border-slate-200 dark:border-slate-700 flex items-center justify-center text-xs text-slate-400">
              No Data
            </div>
          );
        }

        const gradientParts = slices.map(s => `${s.color} ${s.startPercentage}% ${s.endPercentage}%`);

        return (
          <div className="relative flex items-center justify-center cursor-pointer group">
            <div 
              className="w-44 h-44 rounded-full shadow-inner transition-transform duration-300 group-hover:scale-105"
              style={{ background: `conic-gradient(${gradientParts.join(', ')})` }}
            ></div>
            <div className="absolute w-24 h-24 bg-white dark:bg-slate-800 rounded-full flex flex-col items-center justify-center shadow-md">
              <span className="text-[10px] uppercase font-bold text-slate-400">Total</span>
              <span className="text-xs font-black text-rose-500">{currency} {totalExp.toLocaleString()}</span>
            </div>
          </div>
        );
      };

      // MAIN TABLE FILTERED DATA
      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const tDate = new Date(t.date);
          const monthMatch = selectedMonth === 'all' || (tDate.getMonth() + 1).toString().padStart(2, '0') === selectedMonth;
          const yearMatch = selectedYear === 'all' || tDate.getFullYear().toString() === selectedYear;
          const categoryMatch = selectedCategory === 'all' || t.category === selectedCategory;
          const searchMatch = t.description.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              t.category.toLowerCase().includes(searchQuery.toLowerCase());

          return monthMatch && yearMatch && categoryMatch && searchMatch;
        });
      }, [transactions, selectedMonth, selectedYear, selectedCategory, searchQuery]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.amount) return;

        if (editingId !== null) {
          setTransactions(transactions.map(t => 
            t.id === editingId ? { ...t, ...formData, amount: parseFloat(formData.amount) } : t
          ));
          logActivity(`Updated transaction: ${formData.description || formData.category}`);
          setEditingId(null);
        } else {
          const newTx = {
            id: Date.now(),
            amount: parseFloat(formData.amount),
            type: formData.type,
            category: formData.category,
            account: formData.account,
            description: formData.description || formData.category,
            date: formData.date || getTodayString()
          };
          setTransactions([newTx, ...transactions]);
          logActivity(`Added new transaction: ${formData.description || formData.category}`);
        }

        setFormData({
          amount: '',
          type: 'expense',
          category: categories[0] || 'Groceries',
          account: accountsList[0] || 'Cash',
          description: '',
          date: getTodayString()
        });
      };

      const handleEdit = (tx) => {
        setEditingId(tx.id);
        setFormData({
          amount: tx.amount,
          type: tx.type,
          category: tx.category,
          account: tx.account,
          description: tx.description,
          date: tx.date
        });
      };

      const handleDelete = (id) => {
        if (confirm("Are you sure you want to delete this entry?")) {
          const txToDelete = transactions.find(t => t.id === id);
          setTransactions(transactions.filter(t => t.id !== id));
          if (editingId === id) setEditingId(null);
          if (txToDelete) logActivity(`Deleted transaction: ${txToDelete.description}`);
        }
      };

      return (
        <div className="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
          
          {/* Header */}
          <header className="flex justify-between items-center bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
            <div className="flex items-center gap-3 flex-wrap">
              <button 
                onClick={() => setIsDashboardSummaryOpen(true)}
                className="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white transition flex items-center gap-2 text-sm font-semibold shadow-md shadow-blue-500/20">
                <i data-lucide="layout-dashboard" className="w-5 h-5"></i>
                <span>Open Dashboard</span>
              </button>

              <button 
                onClick={() => setIsNewDashboardOpen(true)}
                className="px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white transition flex items-center gap-2 text-sm font-semibold shadow-md shadow-purple-500/20">
                <i data-lucide="grid" className="w-5 h-5"></i>
                <span>Dashboard</span>
              </button>

              <button 
                onClick={() => setIsAnalyticsOpen(true)}
                className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white transition flex items-center gap-2 text-sm font-semibold shadow-md shadow-indigo-500/20">
                <i data-lucide="line-chart" className="w-5 h-5"></i>
                <span>Analytics</span>
              </button>

              <button 
                onClick={() => setIsReportsOpen(true)}
                className="px-4 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white transition flex items-center gap-2 text-sm font-semibold shadow-md shadow-teal-500/20">
                <i data-lucide="file-text" className="w-5 h-5"></i>
                <span>Reports</span>
              </button>

              <button 
                onClick={() => setIsSummaryOpen(true)}
                className="px-4 py-2.5 rounded-xl bg-orange-600 hover:bg-orange-700 text-white transition flex items-center gap-2 text-sm font-semibold shadow-md shadow-orange-500/20">
                <i data-lucide="pie-chart" className="w-5 h-5"></i>
                <span>Summary</span>
              </button>

              <button 
                onClick={() => setIsAdminOpen(true)}
                className="px-4 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white transition flex items-center gap-2 text-sm font-semibold shadow-md shadow-red-500/20">
                <i data-lucide="shield-alert" className="w-5 h-5"></i>
                <span>Admin Panel</span>
              </button>

              <div className="hidden lg:block ml-2">
                <h1 className="text-lg font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                  Md. TAREKUZZAMAN
                </h1>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button 
                onClick={() => setIsSettingsOpen(true)} 
                className="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition flex items-center gap-2 text-sm font-medium">
                <i data-lucide="settings" className="w-5 h-5 text-slate-600 dark:text-slate-300"></i>
                <span className="hidden sm:inline">Settings</span>
              </button>
			  			  
            </div>
          </header>

          {/* ==================== SETTINGS MODAL ==================== */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 max-w-md w-full border border-slate-100 dark:border-slate-700 shadow-2xl space-y-6">
                <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-4">
                  <div className="flex items-center gap-2">
                    <i data-lucide="settings" className="w-5 h-5 text-blue-600"></i>
                    <h2 className="text-xl font-bold">App Settings</h2>
                  </div>
                  <button onClick={() => setIsSettingsOpen(false)} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-slate-400 uppercase block mb-2">Theme Mode</label>
                    <select 
                      value={theme} 
                      onChange={(e) => setTheme(e.target.value)}
                      className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs font-bold">
                      <option value="system">System Default</option>
                      <option value="light">Light Mode</option>
                      <option value="dark">Dark Mode</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-400 uppercase block mb-2">Currency Symbol</label>
                    <input 
                      type="text" 
                      value={currency} 
                      onChange={(e) => setCurrency(e.target.value)} 
                      className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs font-bold"
                    />
                  </div>
                </div>

                <button 
                  onClick={() => setIsSettingsOpen(false)} 
                  className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold transition shadow-lg">
                  Save Changes
                </button>
              </div>
            </div>
          )}










          {/* ==================== ADMIN PANEL MODAL ==================== */}
          {isAdminOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-2 sm:p-4">
              <div className="bg-white dark:bg-slate-800 rounded-3xl p-4 sm:p-6 max-w-4xl w-full border border-slate-100 dark:border-slate-700 shadow-2xl space-y-6 max-h-[95vh] overflow-y-auto">
                
                <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-4">
                  <div className="flex items-center gap-2">
                    <i data-lucide="shield" className="w-6 h-6 text-red-600"></i>
                    <div>
                      <h2 className="text-xl font-bold">System Admin Panel</h2>
                      <p className="text-xs text-slate-400">ক্যাটাগরি, অ্যাকাউন্ট, অ্যাক্টিভিটি লগ পরিচালনা এবং ব্যাকআপ ও রিস্টোর করুন</p>
                    </div>
                  </div>
                  <button onClick={() => setIsAdminOpen(false)} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
					
		

                <div className="flex flex-wrap gap-2 border-b border-slate-100 dark:border-slate-700 pb-3">
                  {[
                    { id: 'category', label: 'Category Management', icon: 'tag' },
                    { id: 'account', label: 'Account Management', icon: 'credit-card' },
                    { id: 'activity', label: 'Activity Log', icon: 'activity' },
                    { id: 'backup_restore', label: 'Backup & Restore', icon: 'database' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveAdminTab(tab.id)}
                      className={`px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${activeAdminTab === tab.id ? 'bg-red-600 text-white shadow-md' : 'bg-slate-100 dark:bg-slate-700 hover:bg-slate-200'}`}>
                      <i data-lucide={tab.icon} className="w-4 h-4"></i>
                      <span>{tab.label}</span>
                    </button>
							
                  ))}
				  
				{/* Admin Action Buttons */}
                <div className="flex flex-wrap gap-2 items-center bg-slate-100 dark:bg-slate-700 p-3 rounded-2xl border border-slate-200 dark:border-slate-700">
                  <button
                    onClick={() => setIsBudgetModalOpen(true)}
                    className="px-4 py-2.5 rounded-xl hover:bg-slate-200' text-black text-xs font-bold transition flex items-center gap-1.5">
                    <i data-lucide="target" className="w-4 h-4"></i>
                    <span>Budget Set</span>
                  </button>
                </div>						  
				  
				  
                </div>

                <div className="space-y-4">
                  
                  {activeAdminTab === 'category' && (
                    <div className="space-y-4">
                      <form onSubmit={handleAddCategory} className="flex gap-2">
                        <input 
                          type="text" 
                          placeholder="Enter new category name..." 
                          value={newCategoryInput} 
                          onChange={(e) => setNewCategoryInput(e.target.value)}
                          className="flex-1 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs font-semibold" 
                        />
                        <button type="submit" className="px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold transition">
                          Add Category
                        </button>
                      </form>

                      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 max-h-60 overflow-y-auto pr-1">
                        {categories.map(cat => (
                          <div key={cat} className="p-3 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-100 dark:border-slate-800 flex justify-between items-center text-xs">
                            <span className="font-bold">{cat}</span>
                            <button onClick={() => handleDeleteCategory(cat)} className="p-1 hover:bg-rose-100 dark:hover:bg-rose-900/50 rounded-lg text-rose-500">
                              <i data-lucide="trash-2" className="w-4 h-4"></i>
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {activeAdminTab === 'account' && (
                    <div className="space-y-4">
                      <form onSubmit={handleAddAccount} className="flex gap-2">
                        <input 
                          type="text" 
                          placeholder="Enter new account name..." 
                          value={newAccountInput} 
                          onChange={(e) => setNewAccountInput(e.target.value)}

                    <div className="space-y-4">
                      <div className="flex justify-between items-center border-b border-slate-200 dark:border-slate-700 pb-3">
                        <h3 className="text-base font-bold capitalize flex items-center gap-2">
                          <i data-lucide={reportType === 'income' ? 'arrow-up-right' : 'arrow-down-left'} className={reportType === 'income' ? 'text-emerald-500' : 'text-rose-500'}></i>
                          {reportType} Report ({reportPeriod.toUpperCase()})
                        </h3>
                        <span className="text-xs font-bold text-slate-400">Total Found: {reportFilteredTx.filter(t => t.type === reportType).length}</span>
                      </div>

                      <div className="divide-y divide-slate-200 dark:divide-slate-700 max-h-72 overflow-y-auto">
                        {reportFilteredTx.filter(t => t.type === reportType).length === 0 ? (
                          <p className="text-xs text-slate-400 py-6 text-center">নির্ধারিত সময়ে কোন {reportType} পাওয়া যায়নি।</p>
                        ) : (
                          reportFilteredTx.filter(t => t.type === reportType).map(t => (
                            <div key={t.id} className="py-3 flex justify-between items-center text-xs">
                              <div>
                                <p className="font-bold text-slate-800 dark:text-slate-100">{t.description}</p>
                                <p className="text-slate-400">{t.date} • {t.category} • <span className="text-blue-500 font-semibold">{t.account}</span></p>
                              </div>
                              <span className={`font-black text-sm ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}`}>
                                {currency} {t.amount.toLocaleString()}
                              </span>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  )}

                  {reportType === 'cashbook' && (
                    <div className="space-y-4">
                      <div className="flex justify-between items-center border-b border-slate-200 dark:border-slate-700 pb-3">
                        <h3 className="text-base font-bold flex items-center gap-2">
                          <i data-lucide="book-open" className="text-amber-500"></i> Cash Book Statement
                        </h3>
                        <span className="text-xs font-bold text-amber-500">Cash Transactions Only</span>
                      </div>
                      <div className="divide-y divide-slate-200 dark:divide-slate-700 max-h-72 overflow-y-auto">
                        {reportFilteredTx.filter(t => t.account === 'Cash').length === 0 ? (
                          <p className="text-xs text-slate-400 py-6 text-center">ক্যাশ অ্যাকাউন্টে কোনো লেনদেন নেই।</p>
                        ) : (
                          reportFilteredTx.filter(t => t.account === 'Cash').map(t => (
                            <div key={t.id} className="py-3 flex justify-between items-center text-xs">
                              <div>
                                <p className="font-bold">{t.description}</p>
                                <p className="text-slate-400">{t.date} • {t.category}</p>
                              </div>
                              <span className={`font-black text-sm ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}`}>
                                {t.type === 'income' ? '+' : '-'} {currency} {t.amount.toLocaleString()}
                              </span>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  )}

                  {reportType === 'ledger' && (
                    <div className="space-y-4">
                      <h3 className="text-base font-bold flex items-center gap-2 border-b border-slate-200 dark:border-slate-700 pb-3">
                        <i data-lucide="notebook" className="text-blue-500"></i> Account Ledger Summary
                      </h3>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {accountsList.map(acc => {
                          const accData = accountBalances[acc] || { income: 0, expense: 0, balance: 0 };
                          return (
                            <div key={acc} className="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 text-xs space-y-1">
                              <div className="flex justify-between font-bold">
                                <span>{acc}</span>
                                <span className={accData.balance >= 0 ? 'text-emerald-600' : 'text-rose-600'}>{currency} {accData.balance.toLocaleString()}</span>
                              </div>
                              <div className="flex justify-between text-[11px] text-slate-400">
                                <span>In: {currency}{accData.income.toLocaleString()}</span>
                                <span>Out: {currency}{accData.expense.toLocaleString()}</span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {reportType === 'category' && (
                    <div className="space-y-4">
                      <h3 className="text-base font-bold flex items-center gap-2 border-b border-slate-200 dark:border-slate-700 pb-3">
                        <i data-lucide="pie-chart" className="text-purple-500"></i> Category Summary
                      </h3>
                      <div className="space-y-2 max-h-72 overflow-y-auto">
                        {categories.map(cat => {
                          const catTotal = reportFilteredTx.filter(t => t.category === cat && t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
                          return (
                            <div key={cat} className="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 flex justify-between items-center text-xs">
                              <span className="font-bold">{cat}</span>
                              <span className="font-black text-rose-500">{currency} {catTotal.toLocaleString()}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {reportType === 'account' && (
                    <div className="space-y-4">
                      <h3 className="text-base font-bold flex items-center gap-2 border-b border-slate-200 dark:border-slate-700 pb-3">
                        <i data-lucide="credit-card" className="text-indigo-500"></i> Account Statement Breakdown
                      </h3>
                      <div className="divide-y divide-slate-200 dark:divide-slate-700 max-h-72 overflow-y-auto">
                        {reportFilteredTx.map(t => (
                          <div key={t.id} className="py-2.5 flex justify-between items-center text-xs">
                            <div>
                              <p className="font-bold">{t.description}</p>
                              <p className="text-slate-400">{t.date} • Account: <span className="text-indigo-500 font-semibold">{t.account}</span></p>
                            </div>
                            <span className={`font-black ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}`}>
                              {t.type === 'income' ? '+' : '-'} {currency} {t.amount.toLocaleString()}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {reportType === 'budget' && (
                   <div className="space-y-4">
                      <h3 className="text-base font-bold flex items-center gap-2 border-b border-slate-200 dark:border-slate-700 pb-3">
                        <i data-lucide="target" className="text-cyan-500"></i> Budget Limit & Performance
                      </h3>
                      {(() => {
                        const totalExp = reportFilteredTx.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
                        const pct = ((totalExp / budgetLimit) * 100).toFixed(1);
                        return (
                          <div className="p-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 space-y-3">
                            <div className="flex justify-between text-xs font-bold">
                              <span>Budget: {currency} {budgetLimit.toLocaleString()}</span>
                              <span>Spent: {currency} {totalExp.toLocaleString()}</span>
                            </div>
                            <div className="w-full bg-slate-200 dark:bg-slate-700 h-3 rounded-full overflow-hidden">
                              <div className={`h-full ${totalExp > budgetLimit ? 'bg-rose-500' : 'bg-cyan-500'}`} style={{ width: `${Math.min(pct, 100)}%` }}></div>
                            </div>
                            <p className="text-xs font-medium text-slate-500">আপনি বাজেট সীমার <span className="font-bold">{pct}%</span> ব্যবহার করেছেন।</p>
                          </div>
                        );
                      })()}
                    </div>
                  )}

                  {reportType === 'goal' && (
                    <div className="space-y-4">
                      <h3 className="text-base font-bold flex items-center gap-2 border-b border-slate-200 dark:border-slate-700 pb-3">
                        <i data-lucide="award" className="text-teal-500"></i> Goal Performance Status
                      </h3>
                      <div className="p-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 space-y-3">
                        <div className="flex justify-between text-xs font-bold">
                          <span>Goal: {goal.name}</span>
                          <span>Target: {currency} {goal.target.toLocaleString()}</span>
                        </div>

                        <div className="w-full bg-slate-200 dark:bg-slate-700 h-3 rounded-full overflow-hidden">
                          <div className="h-full bg-teal-500" style={{ width: `${(goal.current / goal.target) * 100}%` }}></div>
                        </div>
                      </div>
                    </div>
                  )}

                  {reportType === 'tax' && (
                    <div className="space-y-4">
                      <h3 className="text-base font-bold flex items-center gap-2 border-b border-slate-200 dark:border-slate-700 pb-3">

                        const totalInc = reportFilteredTx.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);

                        return (
                          <div className="p-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 space-y-2 text-xs">

                              <span className="font-bold">{currency} {totalInc.toLocaleString()}</span>
                            </div>
                            <div className="flex justify-between text-orange-600 font-bold">
                              <span>Estimated Tax Amount (15%):</span>
                              <span>{currency} {estTax.toLocaleString()}</span>
                            </div>
                          </div>
                        );
                      })()}
                    </div>
                  )}

                </div>

                <button onClick={() => setIsReportsOpen(false)} className="w-full py-3 bg-teal-600 text-white rounded-xl font-bold hover:bg-teal-700 transition shadow-lg">

                </button>

              </div>
            </div>

                    <i data-lucide="line-chart" className="w-6 h-6 text-indigo-600"></i>

                    </div>
                  </div>
                  <button onClick={() => setIsAnalyticsOpen(false)} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                    <i data-lucide="calendar" className="w-4 h-4"></i> Analytics Date Range:
                  </div>
                  <div className="flex flex-wrap items-center gap-3">
                    <div className="flex items-center gap-2 text-xs font-semibold">
                      <span>Start Date:</span>
                      <input 
                        type="date" 
                        value={analyticsStartDate} 
                        onChange={(e) => setAnalyticsStartDate(e.target.value)} 
                        className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs" 
                      />
                    </div>
                    <div className="flex items-center gap-2 text-xs font-semibold">
                      <span>End Date:</span>
                      <input 
                        type="date" 
                        value={analyticsEndDate} 
                        onChange={(e) => setAnalyticsEndDate(e.target.value)} 
                        className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs" 
                      />
                    </div>
                    <button 
                      onClick={() => { setAnalyticsStartDate('2026-01-01'); setAnalyticsEndDate(getTodayString()); }}
                      className="px-3 py-1.5 bg-indigo-600 text-white hover:bg-indigo-700 rounded-xl text-xs font-semibold shadow">
                      Reset
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

                  <div className="bg-slate-50 dark:bg-slate-900/60 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
                    <div className="flex justify-between items-center">
                      <h3 className="text-sm font-bold flex items-center gap-2 text-emerald-600">
                        <i data-lucide="trending-up" className="w-4 h-4"></i> Income Trend
                      </h3>
                      <span className="text-xs font-black text-emerald-600">{currency} {analyticsIncome.toLocaleString()}</span>
                    </div>
                    <div className="space-y-2 pt-2">
                      {monthlyData.length === 0 ? (
                        <p className="text-xs text-slate-400 py-4 text-center">No income record in range</p>
                      ) : (
                        monthlyData.map(([month, val]) => {
                          const maxInc = Math.max(...monthlyData.map(([, v]) => v.income)) || 1;
                          const pct = ((val.income / maxInc) * 100).toFixed(0);
                          return (
                            <div key={month} className="space-y-1">
                              <div className="flex justify-between text-xs text-slate-500 font-semibold">
                                <span>{month}</span>
                                <span className="text-emerald-600">{currency} {val.income.toLocaleString()}</span>
                              </div>
                              <div className="w-full bg-slate-200 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                                <div className="bg-emerald-500 h-full rounded-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>

                  <div className="bg-slate-50 dark:bg-slate-900/60 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
                    <div className="flex justify-between items-center">
                      <h3 className="text-sm font-bold flex items-center gap-2 text-rose-600">
                        <i data-lucide="trending-down" className="w-4 h-4"></i> Expense Trend
                      </h3>
                      <span className="text-xs font-black text-rose-600">{currency} {analyticsExpense.toLocaleString()}</span>
                    </div>
                    <div className="space-y-2 pt-2">
                      {monthlyData.length === 0 ? (
                        <p className="text-xs text-slate-400 py-4 text-center">No expense record in range</p>
                      ) : (
                        monthlyData.map(([month, val]) => {
                          const maxExp = Math.max(...monthlyData.map(([, v]) => v.expense)) || 1;
                          const pct = ((val.expense / maxExp) * 100).toFixed(0);
                          return (
                            <div key={month} className="space-y-1">
                              <div className="flex justify-between text-xs text-slate-500 font-semibold">
                                <span>{month}</span>
                                <span className="text-rose-600">{currency} {val.expense.toLocaleString()}</span>
                              </div>
                              <div className="w-full bg-slate-200 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                                <div className="bg-rose-500 h-full rounded-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>

                  <div className="bg-slate-50 dark:bg-slate-900/60 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
                    <h3 className="text-sm font-bold flex items-center gap-2 text-blue-600">
                      <i data-lucide="arrow-left-right" className="w-4 h-4"></i> Cash Flow Overview
                    </h3>
                    <div className="grid grid-cols-3 gap-2 pt-1 text-center">
                      <div className="p-3 bg-emerald-50 dark:bg-emerald-950/40 rounded-xl border border-emerald-100 dark:border-emerald-900">
                        <p className="text-[10px] text-emerald-600 font-bold uppercase">Income</p>
                        <p className="text-xs sm:text-sm font-black text-emerald-700 dark:text-emerald-400">{currency} {analyticsIncome.toLocaleString()}</p>
                      </div>
                      <div className="p-3 bg-rose-50 dark:bg-rose-950/40 rounded-xl border border-rose-100 dark:border-rose-900">
                        <p className="text-[10px] text-rose-600 font-bold uppercase">Expense</p>
                        <p className="text-xs sm:text-sm font-black text-rose-700 dark:text-rose-400">{currency} {analyticsExpense.toLocaleString()}</p>
                      </div>
                      <div className="p-3 bg-indigo-50 dark:bg-indigo-950/40 rounded-xl border border-indigo-100 dark:border-indigo-900">
                        <p className="text-[10px] text-indigo-600 font-bold uppercase">Net Cash</p>
                        <p className={`text-xs sm:text-sm font-black ${analyticsNetCash >= 0 ? 'text-indigo-700 dark:text-indigo-400' : 'text-rose-600'}`}>{currency} {analyticsNetCash.toLocaleString()}</p>
                      </div>
                    </div>
                  </div>

                  <div className="bg-slate-50 dark:bg-slate-900/60 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
                    <h3 className="text-sm font-bold flex items-center gap-2 text-purple-600">
                      <i data-lucide="bar-chart-2" className="w-4 h-4"></i> Monthly Comparison
                    </h3>
                    <div className="space-y-2 pt-1">
                      {monthlyData.map(([month, val]) => (
                        <div key={month} className="p-2.5 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 flex justify-between items-center text-xs">
                          <span className="font-bold">{month}</span>
                          <div className="flex items-center gap-3 font-semibold">
                            <span className="text-emerald-600">In: {currency}{val.income.toLocaleString()}</span>
                            <span className="text-rose-600">Out: {currency}{val.expense.toLocaleString()}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-slate-50 dark:bg-slate-900/60 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
                    <h3 className="text-sm font-bold flex items-center gap-2 text-amber-600">
                      <i data-lucide="calendar-days" className="w-4 h-4"></i> Yearly Comparison
                    </h3>
                    <div className="space-y-2 pt-1">
                      {yearlyData.map(([year, val]) => (
                        <div key={year} className="p-2.5 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 flex justify-between items-center text-xs">
                          <span className="font-bold">{year}</span>
                          <div className="flex items-center gap-3 font-semibold">
                            <span className="text-emerald-600">In: {currency}{val.income.toLocaleString()}</span>
                            <span className="text-rose-600">Out: {currency}{val.expense.toLocaleString()}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-slate-50 dark:bg-slate-900/60 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
                    <h3 className="text-sm font-bold flex items-center gap-2 text-cyan-600">
                      <i data-lucide="pie-chart" className="w-4 h-4"></i> Category Analysis
                    </h3>
                    <div className="space-y-2 pt-1 max-h-40 overflow-y-auto pr-1">
                      {analyticsCategoryData.length === 0 ? (
                        <p className="text-xs text-slate-400 py-4 text-center">No category expense in range</p>
                      ) : (
                        analyticsCategoryData.map(item => (
                          <div key={item.category} className="space-y-1">
                            <div className="flex justify-between text-xs font-semibold">
                              <span>{item.category} ({item.percentage}%)</span>
                              <span className="text-slate-700 dark:text-slate-300">{currency} {item.amount.toLocaleString()}</span>
                            </div>
                            <div className="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                              <div className="bg-cyan-500 h-full rounded-full" style={{ width: `${item.percentage}%` }}></div>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                </div>

                <button onClick={() => setIsAnalyticsOpen(false)} className="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg">
                  Close Analytics
                </button>
              </div>
            </div>
          )}

          {/* CATEGORY DETAILS MODAL */}
          {selectedCategoryDetails && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 max-w-lg w-full border border-slate-100 dark:border-slate-700 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                  <div>
                    <h3 className="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                      <i data-lucide="shopping-bag" className="w-5 h-5 text-rose-500"></i>
                      {selectedCategoryDetails.category} Expense List
                    </h3>
                  </div>
                  <button onClick={() => setSelectedCategoryDetails(null)} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="divide-y divide-slate-100 dark:divide-slate-700 max-h-60 overflow-y-auto pr-1">
                  {selectedCategoryDetails.items.length === 0 ? (
                    <p className="text-xs text-slate-400 text-center py-4">No items found.</p>
                  ) : (
                    selectedCategoryDetails.items.map(item => (
                      <div key={item.id} className="py-3 flex justify-between items-center">
                        <div>
                          <p className="text-sm font-semibold text-slate-700 dark:text-slate-200">{item.description}</p>
                          <p className="text-xs text-slate-400">{item.date} • <span className="font-semibold text-blue-500">{item.account}</span></p>
                        </div>
                        <p className="text-sm font-black text-rose-500">{currency} {item.amount.toLocaleString()}</p>
                      </div>
                    ))
                  )}
                </div>

                <div className="pt-3 border-t border-slate-100 dark:border-slate-700 flex justify-between items-center">
                  <span className="text-xs font-bold text-slate-500 uppercase">Total Spent</span>
                  <span className="text-base font-black text-rose-600">{currency} {selectedCategoryDetails.total.toLocaleString()}</span>
                </div>

                          <p className="text-slate-400">{item.category} • {item.account}</p>
                        </div>
                        <span className="font-black text-rose-500">{currency} {item.amount.toLocaleString()}</span>
                      </div>
                    ))
                  )}
                </div>
                <button onClick={() => setSelectedDayDetails(null)} className="w-full py-2.5 bg-slate-800 text-white rounded-xl text-xs font-bold hover:bg-slate-900 transition">
                  Close
                </button>
              </div>
            </div>
          )}		  
		  

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
